<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2"/>
      <stop offset="100%" style="stop-color:#9c27b0"/>
    </linearGradient>
    <linearGradient id="fileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e3f2fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="64" ry="64" fill="url(#bgGradient)"/>
  
  <!-- Main file stack -->
  <g filter="url(#shadow)">
    <!-- Back file -->
    <path d="M160 120 L320 120 L320 360 L160 360 Z" fill="#ffffff" opacity="0.4"/>
    
    <!-- Middle file -->
    <path d="M140 140 L300 140 L300 380 L140 380 Z" fill="#ffffff" opacity="0.6"/>
    
    <!-- Front file with folded corner -->
    <path d="M120 160 L240 160 L280 200 L280 400 L120 400 Z" fill="url(#fileGradient)"/>
    <path d="M240 160 L240 200 L280 200 Z" fill="#bbdefb"/>
  </g>
  
  <!-- Animated arrow indicating movement/action -->
  <g transform="translate(300, 260)">
    <path d="M0 0 L60 0 L60 -20 L100 20 L60 60 L60 40 L0 40 Z" fill="#ffffff" opacity="0.95">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 15,0; 0,0" 
        dur="1.5s" 
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
      />
      <animate 
        attributeName="opacity" 
        values="0.95; 1; 0.95" 
        dur="1.5s" 
        repeatCount="indefinite"
      />
    </path>
  </g>
  
  <!-- Animated flying files -->
  <g>
    <rect x="340" y="140" width="40" height="50" rx="4" fill="#ffffff" transform="rotate(-15, 360, 165)">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 20,-10; 0,0" 
        dur="2s" 
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
        additive="sum"
      />
      <animate 
        attributeName="opacity" 
        values="0.8; 1; 0.8" 
        dur="2s" 
        repeatCount="indefinite"
      />
    </rect>
    <rect x="370" y="100" width="35" height="45" rx="4" fill="#ffffff" opacity="0.6" transform="rotate(10, 387, 122)">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 15,-15; 0,0" 
        dur="2.5s" 
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
        additive="sum"
      />
      <animate 
        attributeName="opacity" 
        values="0.6; 0.9; 0.6" 
        dur="2.5s" 
        repeatCount="indefinite"
      />
    </rect>
  </g>
  
  <!-- Subtle pulse on the main file stack -->
  <g filter="url(#shadow)" opacity="0">
    <rect x="115" y="155" width="170" height="250" rx="4" fill="#ffffff">
      <animate 
        attributeName="opacity" 
        values="0; 0.15; 0" 
        dur="3s" 
        repeatCount="indefinite"
      />
    </rect>
  </g>
</svg>
